<html lang="en">
  <head>

    <meta property="og:url" content="https://finova-app-omniaa.vercel.app/" />
    <meta property="og:title" content="Finova — Smart Personal Finance" />
    <meta
      property="og:description"
      content="Track transactions, set budgets, and reach savings goals in one bilingual workspace built for daily money decisions."
    />

      property="og:image"
      content="https://finova-app-omniaa.vercel.app/og-image.png"

    <!-- Twitter / X -->

      name="twitter:description"
      content="Track transactions, set budgets, and reach savings goals in one bilingual workspace built for daily money decisions."
    />
    <meta
      name="twitter:image"
      content="https://finova-app-omniaa.vercel.app/og-image.png"
    />

    <link rel="canonical" href="https://finova-app-omniaa.vercel.app/" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Finova — Smart Personal Finance</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }

        try {
          var lng = localStorage.getItem("language");
          if (lng === "ar") {
            document.documentElement.lang = "ar";
            document.documentElement.dir = "rtl";
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
